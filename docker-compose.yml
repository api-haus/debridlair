services:
  torbox-mount:
    image: rclone/rclone:latest
    container_name: torbox-mount
    restart: unless-stopped
    pull_policy: always
    stop_grace_period: 30s
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      RCLONE_CONFIG_TORBOX_TYPE: webdav
      RCLONE_CONFIG_TORBOX_URL: https://webdav.torbox.app
      RCLONE_CONFIG_TORBOX_VENDOR: other
      RCLONE_CONFIG_TORBOX_USER: ${TORBOX_EMAIL}
      RCLONE_CONFIG_TORBOX_PASS: ${TORBOX_RCLONE_OBSCURED_PASS}
    command: >
      mount torbox: /mnt/torbox
      --config /dev/null
      --allow-other
      --allow-non-empty
      --read-only
      --vfs-cache-mode full
      --vfs-cache-max-size 80G
      --vfs-cache-max-age 72h
      --vfs-read-chunk-size 64M
      --vfs-read-chunk-size-limit 512M
      --buffer-size 32M
      --dir-cache-time 30s
      --poll-interval 30s
      --attr-timeout 10s
      --timeout 30s
      --retries 5
      --low-level-retries 10
      --umask 022
      --log-level INFO
    volumes:
      - ./rclone/mnt:/mnt/torbox:rshared
      - ./rclone/cache:/cache
    healthcheck:
      test: ["CMD-SHELL", "ls /mnt/torbox >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3

  torbox-sync:
    image: python:3.12-alpine
    container_name: torbox-sync
    restart: unless-stopped
    user: "1000:1000"
    command: >
      sh -c "while true; do
        python3 /scripts/torbox_sync.py;
        curl -sf -X POST 'http://emby:8096/emby/Library/Refresh?api_key='$$(cat /sync-state/emby_api_key 2>/dev/null) >/dev/null 2>&1 || true;
        sleep 120;
        python3 /scripts/emby_probe.py --limit 150 || true;
        sleep 780;
      done"
    volumes:
      - ./scripts:/scripts:ro
      - ./library:/library
      - ./.env:/.env:ro
      - ./sync-state:/sync-state:ro
    depends_on:
      - emby

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    ports:
      - "9696:9696"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Kiev
    volumes:
      - ./prowlarr:/config

  emby-throttle:
    image: docker:cli
    container_name: emby-throttle
    network_mode: host
    privileged: true
    restart: "no"
    depends_on:
      - emby
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Cap the emby container's download bandwidth (egress of its veth) so
    # background analysis can never saturate the link again. Tweak RATE here.
    command: >
      sh -c "apk add --no-cache iproute2 >/dev/null 2>&1;
      sleep 8;
      IFIDX=$$(docker exec emby cat /sys/class/net/eth0/iflink) &&
      VETH=$$(grep -l \"^$$IFIDX$$\" /sys/class/net/veth*/ifindex | cut -d/ -f5) &&
      tc qdisc replace dev $$VETH root tbf rate 40mbit burst 2mbit latency 400ms &&
      echo \"throttled $$VETH to 40mbit\""

  emby:
    image: emby/embyserver:4.8.11.0
    container_name: emby
    restart: unless-stopped
    depends_on:
      torbox-mount:
        condition: service_healthy
    ports:
      - "8096:8096"
      - "8920:8920"
      - "7359:7359/udp"
      - "1900:1900/udp"
    devices:
      - /dev/dri
    environment:
      UID: "1000"
      GID: "1000"
      GIDLIST: "985,989,1003"
      TZ: Europe/Kiev
    volumes:
      - ./emby:/config
      - ./library:/media/library
      - /mnt/archive4/strm-extra/anime:/media/anime:ro
      - type: bind
        source: ./rclone/mnt
        target: /media/torbox
        read_only: true
        bind:
          propagation: rshared
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://localhost:8096/emby/System/Info/Public || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
