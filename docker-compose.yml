services:
  torbox-mount:
    image: rclone/rclone:latest
    container_name: torbox-mount
    restart: unless-stopped
    pull_policy: always
    stop_grace_period: 30s
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      RCLONE_CONFIG_TORBOX_TYPE: webdav
      RCLONE_CONFIG_TORBOX_URL: https://webdav.torbox.app
      RCLONE_CONFIG_TORBOX_VENDOR: other
      RCLONE_CONFIG_TORBOX_USER: ${TORBOX_EMAIL}
      RCLONE_CONFIG_TORBOX_PASS: ${TORBOX_RCLONE_OBSCURED_PASS}
    command: >
      mount torbox: /mnt/torbox
      --config /dev/null
      --allow-other
      --allow-non-empty
      --read-only
      --vfs-cache-mode full
      --vfs-cache-max-size 80G
      --vfs-cache-max-age 72h
      --vfs-read-chunk-size 64M
      --vfs-read-chunk-size-limit 512M
      --buffer-size 32M
      --dir-cache-time 30s
      --poll-interval 30s
      --attr-timeout 10s
      --timeout 30s
      --retries 5
      --low-level-retries 10
      --umask 022
      --log-level INFO
    volumes:
      - ./rclone/mnt:/mnt/torbox:rshared
      - ./rclone/cache:/cache
    healthcheck:
      test: ["CMD-SHELL", "ls /mnt/torbox >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3

  torbox-sync:
    image: python:3.12-alpine
    container_name: torbox-sync
    restart: unless-stopped
    user: "1000:1000"
    environment:
      # torbox_watch reaches Prowlarr by service name; the published port on
      # the host is not localhost from in here.
      PROWLARR_URL: http://prowlarr:9696
    command: >
      sh -c "i=0; while true; do
        python3 /scripts/torbox_sync.py;
        curl -sf -X POST 'http://emby:8096/emby/Library/Refresh?api_key='$$(cat /sync-state/emby_api_key 2>/dev/null) >/dev/null 2>&1 || true;
        sleep 120;
        python3 /scripts/emby_probe.py --limit 150 || true;
        i=$$((i+1));
        [ $$((i % 4)) -ne 0 ] || python3 /scripts/torbox_watch.py || true;
        sleep 780;
      done"
    volumes:
      - ./scripts:/scripts:ro
      - ./library:/library
      - ./.env:/.env:ro
      - ./sync-state:/sync-state:ro
      # read-only: only for the <ApiKey> in config.xml
      - ./prowlarr:/prowlarr:ro
    depends_on:
      - emby
      - prowlarr

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    ports:
      - "9696:9696"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Kiev
    volumes:
      - ./prowlarr:/config

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: Europe/Kiev
    # Headless Chrome that answers the Cloudflare challenge RuTracker (and
    # 1337x, EZTV) serve instead of a login form. Prowlarr reaches it by
    # service name; it needs no published port.
    expose:
      - "8191"

  emby-throttle:
    image: alpine:3.20
    container_name: emby-throttle
    network_mode: host
    privileged: true
    restart: "no"
    depends_on:
      - emby
      - torbox-mount
      - prowlarr
    environment:
      RATE: 40mbit
      BRIDGE: br-debrid
    volumes:
      - ./scripts/throttle.sh:/throttle.sh:ro
    # Shared cap for every container on the bridge. Tweak RATE above.
    command: sh /throttle.sh

  emby:
    image: emby/embyserver:4.8.11.0
    container_name: emby
    restart: unless-stopped
    depends_on:
      torbox-mount:
        condition: service_healthy
    ports:
      - "8096:8096"
      - "8920:8920"
      - "7359:7359/udp"
      - "1900:1900/udp"
    devices:
      - /dev/dri
    environment:
      UID: "1000"
      GID: "1000"
      GIDLIST: "985,989,1003"
      TZ: Europe/Kiev
    volumes:
      - ./emby:/config
      - ./library:/media/library
      - ./dub/finished:/media/dub
      - type: bind
        source: ./rclone/mnt
        target: /media/torbox
        read_only: true
        bind:
          propagation: rshared
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://localhost:8096/emby/System/Info/Public || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  # Fixed bridge name so the throttle has a stable device to shape.
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-debrid
      # Insurance against a VPN with a smaller MTU than the bridge. When the
      # host routed egress over surfshark_wg (MTU 1280) while containers ran
      # at the 1500 default, they emitted packets the tunnel couldn't carry,
      # and the ICMP "fragmentation needed" that would fix it never made it
      # back through NAT — so anything with a large TLS handshake (TMDb, TVDB,
      # api.torbox.app) hung until timeout while small requests looked fine.
      # That stalled Emby's metadata scan and failed torbox_sync's listing,
      # which then pruned the library. The VPN is off as of 2026-08-08, so
      # this is belt-and-braces; keep it unless you need the ~1.5% of header
      # overhead back, and lower it if a future tunnel goes below 1280.
      com.docker.network.driver.mtu: "1280"
